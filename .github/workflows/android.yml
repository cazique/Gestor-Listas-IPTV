# Compilación, pruebas y publicación firmada (sección 6.4.3 de SPEC.md).
# Acciones fijadas por commit; versiones comprobadas el 9-10-2026 (DECISIONES.md).
name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      preliminar:
        description: 'Publicar como versión preliminar (canal de pruebas)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar, probar y lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Número de versión
        run: tools/ci_version.sh
      - name: Buscar secretos en el árbol
        run: tools/comprobar_secretos.sh
      - name: Compilar y probar
        run: ./gradlew pruebasNucleo testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Guardar APK de depuración e informes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-debug-e-informes
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/build/reports/
            app/schemas/
          if-no-files-found: ignore
          retention-days: 14

  emulador:
    name: Arranque en emulador (${{ matrix.nombre }})
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # La imagen de Android TV puede no estar disponible en el runner: su fallo no bloquea la publicación.
    continue-on-error: ${{ matrix.nombre == 'tv' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: movil
            api: 35
            target: google_apis
          - nombre: tv
            api: 34
            target: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Número de versión
        run: tools/ci_version.sh
      - name: APK de release firmado con una clave de prueba desechable
        run: |
          ./gradlew assembleRelease
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/prueba.jks" -storetype PKCS12 -alias prueba -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=Prueba" -storepass prueba123 -keypass prueba123
          "$bt/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alineado.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/prueba.jks" --ks-pass pass:prueba123 --out "$RUNNER_TEMP/app-prueba.apk" "$RUNNER_TEMP/alineado.apk"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tools/ci_emulador.sh "$RUNNER_TEMP/app-prueba.apk" ${{ matrix.nombre }}
      - name: Guardar capturas y registros
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulador-${{ matrix.nombre }}
          path: salida-emulador/
          if-no-files-found: ignore
          retention-days: 14

  publicar:
    name: Firmar y publicar Release
    # No se publica nada que no haya arrancado en el emulador.
    needs: [compilar, emulador]
    # Solo en la rama principal, en la rama de trabajo del proyecto o a mano; nunca en pull requests ni forks.
    if: >-
      github.repository_owner == 'cazique' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         github.ref == 'refs/heads/ccr-dc368e82-x0lki4')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar que existen los secretos de firma
        id: secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # KEY_ALIAS y KEY_PASSWORD son opcionales: por defecto "iptvgestor" y la misma contraseña del almacén.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Faltan los secretos de firma (al menos KEYSTORE_BASE64 y KEYSTORE_PASSWORD). No se publica. Ver README.md."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.secretos.outputs.hay == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.secretos.outputs.hay == 'true'
      - name: Número de versión
        if: steps.secretos.outputs.hay == 'true'
        run: tools/ci_version.sh
      - name: Compilar APK de release (sin firmar)
        if: steps.secretos.outputs.hay == 'true'
        run: ./gradlew assembleRelease --stacktrace
      - name: Alinear y firmar (zipalign + apksigner)
        if: steps.secretos.outputs.hay == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'iptvgestor' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: tools/ci_firmar.sh app/build/outputs/apk/release/app-release-unsigned.apk salida/app-release.apk
      - name: update.json, SHA256SUMS y notas
        if: steps.secretos.outputs.hay == 'true'
        env:
          PRELIMINAR: ${{ inputs.preliminar && 'true' || 'false' }}
        run: tools/ci_metadatos.sh salida
      - name: Publicar Release
        if: steps.secretos.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRELIMINAR: ${{ inputs.preliminar && 'true' || 'false' }}
        run: |
          etiqueta="v${VERSION_NAME}"
          if gh release view "$etiqueta" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::El Release $etiqueta ya existe; no se vuelve a publicar."
            exit 0
          fi
          extra=()
          if [ "$PRELIMINAR" = "true" ]; then extra+=(--prerelease); else extra+=(--latest); fi
          gh release create "$etiqueta" \
            salida/app-release.apk salida/update.json salida/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Gestor IPTV $VERSION_NAME" --notes-file salida/notas.md "${extra[@]}"
